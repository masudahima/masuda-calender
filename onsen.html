:root[data-theme="dark"] {
  --primary: #a78bfa; --primary-light: #2e1a5e;
  --bg: #0f0b1e; --surface: #1a1530;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--fg);padding:0}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--primary)}

.header-text{flex:1}
.header-mascot{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff}
.header-title{font-size:22px;font-weight:700;color:#fff}
.header-sub{font-size:15px;color:rgba(255,255,255,.7);margin-top:2px}
.header-count{background:rgba(255,255,255,.18);color:#fff;font-size:15px;padding:6px 14px;border-radius:20px;white-space:nowrap}

.content{padding:14px 0 32px}

/* inner padding sections */
.padded{padding-left:var(--side);padding-right:max(16px,env(safe-area-inset-right,0px))}

/* view toggle */
.view-toggle{display:flex;border:2px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.vbtn{flex:1;padding:15px 0;font-size:18px;font-weight:600;border:none;background:var(--surface);color:var(--fg-3);transition:.15s}
.vbtn.active{background:var(--primary);color:#fff}
.vbtn:first-child{border-right:2px solid var(--border)}

/* filter */
.filter-wrap{overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.filter-wrap::-webkit-scrollbar{display:none}
.filter-bar{display:flex;gap:8px;padding:0 var(--side) 2px;width:max-content}
.chip{padding:10px 18px;border-radius:24px;font-size:16px;font-weight:500;white-space:nowrap;
  cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--fg-2);transition:.15s}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.card-scroll-wrap{overflow:hidden;margin-bottom:8px}
.card-scroll{
  display:flex;

  scroll-snap-type:x mandatory;
  gap:0;
  padding:4px 0 16px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.card-scroll::-webkit-scrollbar{display:none}
.card{
  scroll-snap-align:start;
  flex-shrink:0;
  width:92vw;
  padding:0 var(--side);
  background:transparent;
  border:none;
  border-radius:0;
  overflow:visible;
}
.card-inner{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}
.card-photo{
  width:100%;
  height:220px;
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-mascot{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#fff}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.6);font-size:13px}
.photo-placeholder svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.sbadge{position:absolute;top:12px;right:12px;padding:8px 14px;border-radius:20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.sbadge svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.sbadge.yes{background:var(--sauna-yes);color:var(--sauna-yes-fg)}
.sbadge.no{background:var(--sauna-no);color:var(--sauna-no-fg)}
.dist-tag{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;font-weight:600;padding:7px 14px;border-radius:20px;font-family:'Inter',sans-serif}
.status-tag{position:absolute;top:12px;left:12px;padding:8px 14px;border-radius:20px;font-size:15px;font-weight:700}
.open{background:var(--open-bg);color:var(--open-fg)}
.closed{background:var(--closed-bg);color:var(--closed-fg)}

.card-body{padding:18px 18px 18px}
.onsen-name{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:5px}
.area-row{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--fg-3);margin-bottom:14px}
.area-row svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.info-grid{display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;font-size:16px;margin-bottom:14px}
.il{color:var(--fg-3);font-size:15px;padding-top:1px;white-space:nowrap}
.iv{color:var(--fg-2);line-height:1.5;min-width:0}
.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:0}
.tag{padding:6px 13px;border-radius:8px;font-size:15px;font-weight:500;background:var(--primary-light);color:var(--primary)}
.link-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.link-btn{display:inline-flex;align-items:center;gap:6px;padding:12px 18px;border-radius:10px;

.link-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

.dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:.2s}
.dot.active{background:var(--primary);width:22px;border-radius:4px}

.cmp-view{padding:0 var(--side)}

.cmp-row:first-child{border-top:1px solid var(--border)}
.cmp-name{font-size:20px;font-weight:700;line-height:1.2}
.cmp-area{font-size:15px;color:var(--fg-3);margin-top:3px}
.sauna-dot{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;line-height:1;margin-top:7px}

.sauna-dot.no{background:var(--sauna-no);color:var(--sauna-no-fg)}

.status-big{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:90px}
.s-pill{padding:8px 14px;border-radius:20px;font-size:16px;font-weight:700;white-space:nowrap;text-align:center}
.s-hours{font-size:13px;color:var(--fg-3)}

.swipe-hint{font-size:16px;color:var(--fg-3);text-align:center;padding:0 0 12px;letter-spacing:0.03em}
.card-view[hidden],.cmp-view[hidden]{display:none!important}
.note{font-size:14px;color:var(--fg-3);text-align:center;padding:8px var(--side) 20px}

/* === senior-friendly sizing (2026-10-30) === */
body{font-size:17px}

.note{font-size:15px}

</style>

const pinSvg = `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
const saunaSvg = `<svg viewBox="0 0 24 24"><path d="M12 2c-1 3-3 5-3 8a3 3 0 0 0 6 0c0-3-2-5-3-8z"/><path d="M8 16c-1 2-1 4 0 6"/><path d="M16 16c1 2 1 4 0 6"/></svg>`;
const igSvg = `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>`;
const webSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>`;

function photoHtml(s){ return s.img ? `<img class="card-img" src="${s.img}" alt="${s.name}" loading="lazy">` : `<img class="card-mascot" src="img/icon.png" alt="">`; }
function renderCards() {
  const sorted = getSorted(getFiltered());
  document.getElementById('count-badge').textContent = sorted.length + 'か所';
  const scroll = document.getElementById('card-scroll');
  scroll.innerHTML = sorted.map(s => `
    <div class="card" id="card-${s.id}">
      <div class="card-inner">
        <div class="card-photo" style="background:${s.color}">
          ${photoHtml(s)}
          <div class="status-tag ${s.open?'open':'closed'}">${s.open?'営業中':'休業'}</div>
          <div class="sbadge ${s.sauna?'yes':'no'}">${s.sauna?saunaSvg+' サウナあり':'サウナなし'}</div>
          <div class="dist-tag">車 ${s.dist}分</div>
        </div>
        <div class="card-body">
          <div class="onsen-name">${s.name}</div>
          <div class="area-row">${pinSvg} ${s.area}</div>
          <div class="info-grid">
            <span class="il">営業時間</span><span class="iv">${s.hours.split('（')[0]}</span>
            <span class="il">定休日</span><span class="iv">${s.closed}</span>
            <span class="il">料金</span><span class="iv">${s.price}</span>
          </div>
          <div class="tag-row">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          ${(s.instagram||s.website)?`<div class="link-btns">
            ${s.instagram?`<a class="link-btn" href="${s.instagram}" target="_blank" rel="noopener">${igSvg}Instagram</a>`:''}
            ${s.website?`<a class="link-btn" href="${s.website}" target="_blank" rel="noopener">${webSvg}公式HP</a>`:''}
          </div>`:''}
        </div>
      </div>
    </div>
  `).join('');

  // dots
  const dots = document.getElementById('dots');
  dots.innerHTML = sorted.map((_,i) => `<div class="dot${i===0?' active':''}" data-i="${i}"></div>`).join('');

  // scroll → update dots (each card = 100vw)
  scroll.addEventListener('scroll', () => {
    const w = window.innerWidth;
    const i = Math.round(scroll.scrollLeft / w);
    dots.querySelectorAll('.dot').forEach((d,j) => d.classList.toggle('active', i===j));
  }, {passive:true});
}

function renderCmp() {
  const sorted = getSorted(getFiltered());
  document.getElementById('count-badge').textContent = sorted.length + 'か所';
  document.getElementById('cmp-view').innerHTML = sorted.map(s => `
    <div class="cmp-row" onclick="switchView('card')">
      <div>
        <div class="cmp-name">${s.name}</div>
        <div class="cmp-area">${s.area}</div>
        <div><span class="sauna-dot ${s.sauna?'yes':'no'}">${s.sauna?saunaSvg:''} サウナ${s.sauna?'あり':'なし'}</span></div>
      </div>
      <div class="cmp-dist">車 ${s.dist}分</div>
      <div class="status-big">
        <div class="s-pill ${s.open?'open':'closed'}">${s.open?'営業中':'休業'}</div>
        <div class="s-hours">${s.open?s.hours.split('（')[0]:s.closed}</div>
      </div>
    </div>
  `).join('');
}

function render() { renderCards(); renderCmp(); }

function switchView(v) {
  currentView = v;
  document.getElementById('card-view').hidden = (v !== 'card');
  document.getElementById('cmp-view').hidden = (v !== 'cmp');
  document.getElementById('btn-card').classList.toggle('active', v==='card');
  document.getElementById('btn-cmp').classList.toggle('active', v==='cmp');
}

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.f;
  render();
});

render();
</script>
