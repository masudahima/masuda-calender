<title>温泉まとめ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@600;800&display=swap">
<style>
/* single-column mobile-first, site purple palette, comparison + detail dual view */
:root {
  --primary: #7c3aed;
  --primary-d: #5b21b6;
  --primary-light: #ede9fe;
  --bg: #f5f3ff;
  --surface: #ffffff;
  --fg: #1e1b2e;
  --fg-2: #4a4560;
  --fg-3: #7c7592;
  --border: #e4e0f2;
  --sauna-yes: #7c3aed;
  --sauna-yes-fg: #fff;
  --sauna-no: #e5e2ef;
  --sauna-no-fg: #6b6483;
  --open-bg: #d1fae5; --open-fg: #065f46;
  --closed-bg: #fef3c7; --closed-fg: #92400e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #a78bfa; --primary-d: #7c3aed;
    --primary-light: #2e1a5e;
    --bg: #0f0b1e; --surface: #1a1530;
    --fg: #ede9fe; --fg-2: #c4bde8; --fg-3: #8b82b0; --border: #2e2850;
    --sauna-yes: #6d28d9; --sauna-yes-fg: #ede9fe;
    --sauna-no: #2e2850; --sauna-no-fg: #a09abc;
    --open-bg: #064e3b; --open-fg: #6ee7b7;
    --closed-bg: #451a03; --closed-fg: #fcd34d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: #a78bfa; --primary-d: #7c3aed;
  --primary-light: #2e1a5e;
  --bg: #0f0b1e; --surface: #1a1530;
  --fg: #ede9fe; --fg-2: #c4bde8; --fg-3: #8b82b0; --border: #2e2850;
  --sauna-yes: #6d28d9; --sauna-yes-fg: #ede9fe;
  --sauna-no: #2e2850; --sauna-no-fg: #a09abc;
  --open-bg: #064e3b; --open-fg: #6ee7b7;
  --closed-bg: #451a03; --closed-fg: #fcd34d;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--primary)}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);
  padding:13px 0 11px;display:flex;align-items:center;gap:10px}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);
  border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.header-text{flex:1}
.header-title{font-size:17px;font-weight:700;color:#fff;line-height:1.2}
.header-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.header-count{background:rgba(255,255,255,.18);color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}

.content{padding:14px 0 32px;max-width:560px;margin:0 auto}

/* view toggle */
.view-toggle{display:flex;gap:0;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.vbtn{flex:1;padding:8px 0;font-size:13px;font-weight:500;border:none;background:var(--surface);color:var(--fg-3);transition:.15s}
.vbtn.active{background:var(--primary);color:#fff}
.vbtn:first-child{border-right:1.5px solid var(--border)}

/* filter */
.filter-bar{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;
  cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--fg-2);transition:.15s}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ===== COMPARISON VIEW ===== */
.cmp-view{display:flex;flex-direction:column;gap:0}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:8px 10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.cmp-row:first-child{border-top:1px solid var(--border)}
.cmp-name{font-size:15px;font-weight:700;line-height:1.2}
.cmp-area{font-size:11px;color:var(--fg-3);margin-top:2px}
.cmp-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cmp-dist{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--fg-3)}
.sauna-dot{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:20px;font-size:10px;font-weight:700;line-height:1}
.sauna-dot svg{width:11px;height:11px;flex-shrink:0}
.sauna-dot.yes{background:var(--sauna-yes);color:var(--sauna-yes-fg)}
.sauna-dot.no{background:var(--sauna-no);color:var(--sauna-no-fg)}
.status-big{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:80px}
.s-pill{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;text-align:center}
.open{background:var(--open-bg);color:var(--open-fg)}
.closed{background:var(--closed-bg);color:var(--closed-fg)}
.s-hours{font-size:10px;color:var(--fg-3)}

/* ===== CARD VIEW ===== */
.card-view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-photo{width:100%;aspect-ratio:16/7;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.65);font-size:13px}
.photo-placeholder svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.sbadge{position:absolute;top:10px;right:10px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.sbadge svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.sbadge.yes{background:var(--sauna-yes);color:var(--sauna-yes-fg)}
.sbadge.no{background:var(--sauna-no);color:var(--sauna-no-fg)}
.dist-tag{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:'Inter',sans-serif}
.card-body{padding:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.onsen-name{font-size:16px;font-weight:700;line-height:1.3}
.status-card{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:2px}
.area-tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--fg-3);margin-bottom:10px}
.area-tag svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.info-grid{display:grid;grid-template-columns:max-content 1fr;gap:5px 10px;font-size:13px;margin-bottom:10px}
.il{color:var(--fg-3);font-size:12px;padding-top:1px;white-space:nowrap}
.iv{color:var(--fg-2);line-height:1.5}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:500;background:var(--primary-light);color:var(--primary)}
.link-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.link-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;
  font-size:12px;font-weight:600;text-decoration:none;border:1.5px solid var(--border);
  background:var(--surface);color:var(--fg-2);transition:.15s}
.link-btn:hover{border-color:var(--primary);color:var(--primary)}
.link-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* hidden */
.card-view[hidden],.cmp-view[hidden]{display:none!important}
.note{font-size:12px;color:var(--fg-3);text-align:center;padding:8px 0 20px}
</style>

<div class="header">
  <button class="back-btn" aria-label="戻る"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="header-text">
    <div class="header-title">♨ 温泉まとめ</div>
    <div class="header-sub">益田駅から車で約1時間半以内</div>
  </div>
  <div class="header-count">9か所</div>
</div>

<div class="content">
  <div class="view-toggle">
    <button class="vbtn active" id="btn-card" onclick="switchView('card')">詳細カード</button>
    <button class="vbtn" id="btn-cmp" onclick="switchView('cmp')">今日の比較</button>
  </div>

  <div class="filter-bar" id="filters">
    <div class="chip active" data-f="all">すべて</div>
    <div class="chip" data-f="open">今日営業中</div>
    <div class="chip" data-f="sauna">サウナあり</div>
    <div class="chip" data-f="masuda">益田市</div>
    <div class="chip" data-f="tsuwano">津和野・吉賀</div>
    <div class="chip" data-f="hamada">浜田市</div>
    <div class="chip" data-f="hagi">萩市</div>
    <div class="chip" data-f="yamaguchi">山口県</div>
  </div>

  <!-- COMPARISON VIEW -->
  <div class="cmp-view" id="cmp-view" hidden>
    <!-- rows injected by JS -->
  </div>

  <!-- CARD VIEW -->
  <div class="card-view" id="card-view">
    <!-- cards injected by JS -->
  </div>

  <div class="note" id="note">営業時間・料金は変更になる場合があります。事前にご確認ください。</div>
</div>

<script>
// ===== ここにURLを入れてください =====
const spots = [
  {
    id:1, name:"匹見峡温泉 やすらぎの湯", area:"匹見（益田市）", filter:["masuda"],
    dist:50, sauna:false, open:true,
    hours:"10:00〜20:00（最終受付 19:30）", closed:"毎週月曜日",
    price:"大人 550円 / 子供 270円",
    tags:["露天風呂","渓谷ビュー"],
    color:"#2d6e55",
    instagram:"", website:""
  },
  {
    id:2, name:"美都温泉 湯元館", area:"美都（益田市）", filter:["masuda"],
    dist:30, sauna:true, open:true,
    hours:"10:00〜21:00（最終受付 20:30）", closed:"毎週火曜日",
    price:"大人 620円 / 子供 310円",
    tags:["露天風呂","サウナ","休憩室あり"],
    color:"#6d4c8a",
    instagram:"", website:""
  },
  {
    id:3, name:"柿木温泉", area:"吉賀町", filter:["tsuwano"],
    dist:40, sauna:false, open:true,
    hours:"10:00〜21:00（最終受付 20:30）", closed:"第2・第4水曜日",
    price:"大人 500円 / 子供 250円",
    tags:["源泉かけ流し","内湯"],
    color:"#5c4a8a",
    instagram:"", website:""
  },
  {
    id:4, name:"津和野温泉 なごみの里", area:"津和野町", filter:["tsuwano"],
    dist:40, sauna:false, open:false,
    hours:"10:00〜20:00（最終受付 19:30）", closed:"第2・第4水曜日",
    price:"大人 500円 / 子供 250円",
    tags:["内湯のみ","道の駅隣接"],
    color:"#2e5e7a",
    instagram:"", website:""
  },
  {
    id:5, name:"サンレディー浜田", area:"浜田市", filter:["hamada"],
    dist:40, sauna:true, open:true,
    hours:"10:00〜22:00（最終受付 21:30）", closed:"年中無休",
    price:"大人 700円 / 子供 350円",
    tags:["露天風呂","サウナ","岩盤浴"],
    color:"#7a3d3d",
    instagram:"", website:""
  },
  {
    id:6, name:"萩阿武温泉 ゆとりの里", area:"萩市", filter:["hagi","yamaguchi"],
    dist:70, sauna:true, open:true,
    hours:"10:00〜21:00（最終受付 20:30）", closed:"第1・第3火曜日",
    price:"大人 650円 / 子供 320円",
    tags:["露天風呂","サウナ","食事処"],
    color:"#3d6648",
    instagram:"", website:""
  },
  {
    id:7, name:"願成就温泉", area:"萩市周辺", filter:["hagi","yamaguchi"],
    dist:75, sauna:false, open:true,
    hours:"10:00〜20:00（最終受付 19:30）", closed:"不定休",
    price:"大人 500円 / 子供 250円",
    tags:["源泉かけ流し","内湯"],
    color:"#5a4060",
    instagram:"", website:""
  },
  {
    id:8, name:"俵山温泉 清流荘", area:"長門市", filter:["yamaguchi"],
    dist:80, sauna:false, open:true,
    hours:"9:00〜21:00（最終受付 20:30）", closed:"第2・第4木曜日",
    price:"大人 580円 / 子供 280円",
    tags:["源泉かけ流し","歴史的温泉"],
    color:"#2d5a5a",
    instagram:"", website:""
  },
  {
    id:9, name:"長門湯本温泉 恩湯", area:"長門市", filter:["yamaguchi"],
    dist:90, sauna:true, open:true,
    hours:"6:00〜22:00（最終受付 21:30）", closed:"不定休",
    price:"大人 700円 / 子供 350円",
    tags:["源泉かけ流し","歴史的温泉地","早朝営業"],
    color:"#3d6648",
    instagram:"", website:""
  }
];
// =====================================

let currentFilter = "all";
let currentView = "card";

function getFiltered() {
  return spots.filter(s => {
    if (currentFilter === "all") return true;
    if (currentFilter === "open") return s.open;
    if (currentFilter === "sauna") return s.sauna;
    return s.filter.includes(currentFilter);
  });
}

function saunaIcon() {
  return `<svg viewBox="0 0 24 24"><path d="M12 2c-1 3-3 5-3 8a3 3 0 0 0 6 0c0-3-2-5-3-8z"/><path d="M8 16c-1 2-1 4 0 6"/><path d="M16 16c1 2 1 4 0 6"/></svg>`;
}
function photoIcon() {
  return `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
}
function pinIcon() {
  return `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
}

function renderCmp() {
  const filtered = getFiltered();
  const sorted = [...filtered].sort((a,b) => (b.open - a.open) || (spots.indexOf(a) - spots.indexOf(b)));
  const el = document.getElementById('cmp-view');
  el.innerHTML = sorted.map(s => `
    <div class="cmp-row" onclick="switchView('card');scrollToCard(${s.id})">
      <div>
        <div class="cmp-name">${s.name}</div>
        <div class="cmp-area">${s.area}</div>
        <div style="margin-top:5px">
          <span class="sauna-dot ${s.sauna?'yes':'no'}">${s.sauna?saunaIcon():''} サウナ${s.sauna?'あり':'なし'}</span>
        </div>
      </div>
      <div class="cmp-dist">車 ${s.dist}分</div>
      <div class="status-big">
        <div class="s-pill ${s.open?'open':'closed'}">${s.open?'営業中':'休業'}</div>
        <div class="s-hours">${s.open ? s.hours.split('（')[0] : s.closed}</div>
      </div>
    </div>
  `).join('');
}

function renderCards() {
  const filtered = getFiltered();
  const sorted = [...filtered].sort((a,b) => (b.open - a.open) || (spots.indexOf(a) - spots.indexOf(b)));
  const el = document.getElementById('card-view');
  el.innerHTML = sorted.map(s => `
    <div class="card" id="card-${s.id}">
      <div class="card-photo" style="background:${s.color}">
        <div class="photo-placeholder">${photoIcon()}<span>写真</span></div>
        <div class="sbadge ${s.sauna?'yes':'no'}">${s.sauna?saunaIcon()+' サウナあり':'サウナなし'}</div>
        <div class="dist-tag">車 ${s.dist}分</div>
      </div>
      <div class="card-body">
        <div class="card-head">
          <div class="onsen-name">${s.name}</div>
          <div class="status-card ${s.open?'open':'closed'}">${s.open?'営業中':'休業'}</div>
        </div>
        <div class="area-tag">${pinIcon()} ${s.area}</div>
        <div class="info-grid">
          <span class="il">営業時間</span><span class="iv">${s.hours}</span>
          <span class="il">定休日</span><span class="iv">${s.closed}</span>
          <span class="il">料金</span><span class="iv">${s.price}</span>
        </div>
        <div class="tag-row">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        ${(s.instagram || s.website) ? `<div class="link-btns">
          ${s.instagram ? `<a class="link-btn" href="${s.instagram}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>` : ''}
          ${s.website ? `<a class="link-btn" href="${s.website}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>公式HP</a>` : ''}
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

function render() {
  renderCmp();
  renderCards();
}

function switchView(v) {
  currentView = v;
  document.getElementById('cmp-view').hidden = (v !== 'cmp');
  document.getElementById('card-view').hidden = (v !== 'card');
  document.getElementById('btn-cmp').classList.toggle('active', v==='cmp');
  document.getElementById('btn-card').classList.toggle('active', v==='card');
}

function scrollToCard(id) {
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.f;
  render();
});

render();
</script>
