<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>はぎマルシェ | 益田市（津和野町・浜田市・萩市）イベントカレンダー（見本）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f6f3ec; color: #243024; font-family: "Zen Kaku Gothic New", sans-serif; }
  .band { background: linear-gradient(180deg, #cdbcf2 0%, #efe9fb 55%, #f6f3ec 100%); padding: 22px 16px 14px; text-align: center; }
  .band .site { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 15px; color: #232a5e; letter-spacing: .02em; }
  .band .sub { font-size: 11.5px; color: #5a6079; margin-top: 4px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 6px 14px 40px; }
  .preview-note { background: #1a1a2e; color: #fff; font-size: 12px; font-weight: 700; text-align: center; padding: 8px 12px; border-radius: 10px; margin: 10px 0 14px; }
  .card { background: #fffdf6; border: 2px solid #232a5e; border-radius: 20px; box-shadow: 6px 6px 0 #bfe8d2; padding: 18px 16px 20px; position: relative; }
  .chip { display: inline-block; background: #3b82c4; color: #fff; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 999px; }
  h1 { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 24px; color: #232a5e; margin: 10px 0 12px; line-height: 1.4; }
  .flyer { background: #f3ead8; border-radius: 14px; padding: 8px; margin-bottom: 16px; }
  .flyer img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .pill { display: inline-block; background: #d9f2e3; color: #1b4332; font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; margin-bottom: 10px; }
  .place { font-size: 15px; font-weight: 700; color: #243024; margin-bottom: 14px; }
  .place .pin { color: #2d6a4f; }
  .body p { font-size: 15px; line-height: 1.95; margin-bottom: 10px; }
  .info { background: #f0faf4; border-radius: 14px; padding: 14px 16px; margin: 16px 0 20px; }
  .info div { font-size: 14px; line-height: 1.8; }
  .info b { color: #1b4332; }
  .btn { display: block; text-align: center; text-decoration: none; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 15px; padding: 13px; border-radius: 999px; margin-bottom: 10px; }
  .btn-main { background: #2d6a4f; color: #fff; }
  .btn-back { background: #232a5e; color: #fff; }
  .foot { text-align: center; font-size: 12px; color: #8a8f7a; margin-top: 18px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="band">
    <div class="site">益田市（津和野町・浜田市・萩市）イベントカレンダー</div>
    <div class="sub">島根県西部、萩石見の地域情報</div>
  </div>
  <div class="wrap">
    <div class="preview-note">これは見本ページです。本番のサイトではありません</div>
    <article class="card">
      <span class="chip">萩市</span>
      <h1>はぎマルシェ</h1>
      <div class="flyer"><img src="https://mrscrbscfktbcpgvajmc.supabase.co/storage/v1/object/public/event-images/2026-11-21-hagi-marche.jpg" alt="はぎマルシェのチラシ"></div>
      <span class="pill">11月21日（土）10:30〜14:00</span>
      <div class="place"><span class="pin">📍</span> 田町商店街（萩市）</div>
      <div class="body">
        <p>会場が萩市中央公園から、萩・田町商店街に変更になりました（公式発表）。</p>
        <p>本部で柚子の配布があります（先着順、数に限りあり）。</p>
        <p>農林水産業、飲食、物販など多数出店します。</p>
      </div>
      <div class="info">
        <div><b>日時：</b>2026年11月21日（土）10:30〜14:00</div>
        <div><b>場所：</b>田町商店街（萩市）</div>
      </div>
      <a class="btn btn-main" href="https://www.instagram.com/p/Df1zWeEC2oM/" target="_blank" rel="noopener noreferrer">公式ページを見る</a>
      <a class="btn btn-back" href="https://masuda-event.com/">トップへ戻る</a>
    </article>
    <div class="foot">益田市（津和野町・浜田市・萩市）イベントカレンダー<br>個人運営の地域情報サイトです</div>
  </div>
</body>
</html>
